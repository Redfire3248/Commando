<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>GUNHOLLOW — choose a game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; min-height: 100%; background: #07080d; color: #e6edf7; font-family: Rajdhani, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 32px 16px; box-sizing: border-box; min-height: 100vh; }
  h1 { font: 700 clamp(34px, 7vw, 64px) Cinzel, serif; letter-spacing: .18em; margin: 0; text-align: center; }
  .games { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  a.card {
    width: min(340px, 86vw); padding: 28px 26px; border-radius: 16px; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,.14); background: linear-gradient(180deg, #111726, #0a0d16);
    transition: transform .15s, border-color .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-4px); border-color: var(--c); outline: none; }
  .card h2 { margin: 0 0 6px; font-size: 30px; letter-spacing: .06em; color: var(--c); }
  .card p { margin: 0; font-size: 18px; line-height: 1.4; color: #aeb9cb; }
  .card span { display: inline-block; margin-top: 18px; font-size: 16px; letter-spacing: .12em; color: var(--c); }
</style>
</head>
<body>
<h1>GUNHOLLOW</h1>
<div class="games">
  <a class="card" href="hollow/" style="--c:#6ff3ff">
    <h2>HOLLOW</h2>
    <p>Sword, dash and wall-jump through a haunted cavern. Explore, fight, rest at benches.</p>
    <span>PLAY ▸</span>
  </a>
  <a class="card" href="contra/" style="--c:#ff9a3c">
    <h2>COMMANDO</h2>
    <p>Run-and-gun through the jungle. One hit and you are down. One or two players, friends list.</p>
    <span>PLAY ▸</span>
  </a>
</div>
<script>
  // The first version of the game installed an offline helper for the whole site. Each game now has
  // its own, so remove the old site-wide one.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => {
      if (new URL(r.scope).pathname === '/') r.unregister();
    }));
  }
</script>
</body>
</html>
