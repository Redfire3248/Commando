<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GUNHOLLOW</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<body>
<div id="game"></div>

<!-- On-screen controls (shown automatically on touch devices) -->
<div id="touch" class="hidden">
  <div id="stick-zone"><div id="stick"><div id="knob"></div></div></div>
  <div id="btns">
    <button data-btn="lock"  id="b-lock">AIM</button>
    <button data-btn="next"  id="b-next">SWAP</button>
    <button data-btn="dash"  id="b-dash">DASH</button>
    <button data-btn="slash" id="b-slash">SLASH</button>
    <button data-btn="shoot" id="b-shoot">FIRE</button>
    <button data-btn="jump"  id="b-jump">JUMP</button>
  </div>
</div>

<div id="top-btns">
  <button id="install-btn" class="hidden">⬇ Install App</button>
  <button id="fs-btn" title="Fullscreen">⛶</button>
</div>
<div id="rotate">↻<br>Rotate your device to landscape</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="src/config.js"></script>
<script src="data/weapons.js"></script>
<script src="data/enemies.js"></script>
<script src="data/items.js"></script>
<script src="data/rooms.js"></script>
<script src="data/art.gen.js"></script>
<script src="src/save.js"></script>
<script src="src/art/placeholders.js"></script>
<script src="src/input/touch.js"></script>
<script src="src/input/Controls.js"></script>
<script src="src/systems/Weapons.js"></script>
<script src="src/entities/Player.js"></script>
<script src="src/entities/Enemy.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/scenes/HUDScene.js"></script>
<script src="src/pwa.js"></script>
<script src="src/main.js"></script>
</body>
</html>
